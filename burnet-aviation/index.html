<style>
  :root{

    :root{--bg:#f5f6f8;--card:#fff;--card2:#f0f2f5;--line:#e2e5ea;--text:#1a1d23;--muted:#606874;
      --green:#0f7a4d;--yellow:#8a6300;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 22px;font-size:14px}
  .sub a{color:var(--accent2);text-decoration:none}
  .sub a:hover{text-decoration:underline}
  .home{display:inline-block;margin-bottom:14px;color:var(--muted);text-decoration:none;font-size:12.5px}
  .home:hover{color:var(--accent2);text-decoration:underline}

  .controls{display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:end;margin-bottom:8px}
  @media(max-width:560px){.controls{grid-template-columns:1fr}}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  input[type=search],select{background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:10px 12px;font-size:14px;outline:none;width:100%}
  input[type=search]:focus,select:focus{border-color:var(--accent)}
  .meta{display:flex;justify-content:space-between;align-items:center;margin:14px 0 12px;color:var(--muted);font-size:13px}

  .co{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
  .co:hover{border-color:var(--accent2)}
  .co h2{font-size:17px;margin:0 0 2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .type{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;
    letter-spacing:.4px;background:rgba(79,157,255,.14);border:1px solid rgba(79,157,255,.35);color:var(--accent2)}
  .type.legacy{background:rgba(154,163,175,.13);border-color:var(--line);color:var(--muted)}
  .type.unverified{background:rgba(245,197,66,.13);border-color:rgba(245,197,66,.35);color:var(--yellow)}
  .type.nearby{background:rgba(154,163,175,.13);border-color:var(--line);color:var(--muted)}
  @media (prefers-color-scheme: light){.type{color:#1b5fbe}}
  .contact{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0 10px;font-size:13.5px;color:var(--muted)}
  .contact a{color:var(--accent2);text-decoration:none}
  .contact a:hover{text-decoration:underline}
  .contact .lbl{color:var(--muted);opacity:.75;margin-right:4px;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .svc{margin:0;color:var(--text);font-size:14px}
  .addr{color:var(--muted);font-size:12.5px;margin-top:8px}
  .src{margin-top:8px;font-size:11.5px;color:var(--muted)}
  .src a{color:var(--muted);text-decoration:none}
  .src a:hover{color:var(--accent2);text-decoration:underline}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .foot{margin-top:24px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="../index.html">&larr; All tools</a>
  <h1>Aviation Companies &mdash; Burnet, TX</h1>
  <p class="sub" id="sub"></p>

  <div class="controls">
    <div class="fld">

    </div>
    <div class="fld">
      <label>Type</label>
      <select id="type"><option value="">All</option></select>
    </div>
  </div>

  <div class="meta"><div id="count"></div></div>

  <div id="list"></div>
  <div class="empty" id="empty" hidden>No companies match.</div>

  <div class="foot" id="foot"></div>
</div>

<script>
const DATA = JSON.parse(document.getElementById("companies-data").textContent);
const CO = DATA.companies;

const $ = (id) => document.getElementById(id);
const q = $("q"), typeSel = $("type");

for (const c of CO) c._hay = [c.name, c.type, c.services, c.phone, c.address].join(" ").toLowerCase();

for (const t of [...new Set(CO.map(c => c.type))]) {
  const o = document.createElement("option");
  o.value = t; o.textContent = t;
  typeSel.appendChild(o);
}

function esc(s) {
  return (s || "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}
function host(u) { try { return new URL(u).host.replace(/^www\./, ""); } catch { return u; } }

function cardHtml(c) {
  const badge = c.status === "active" ? "" : ` <span class="type ${c.status}">${c.status}</span>`;
  const phones = c.phone.split("/").map(p =>
    `<a href="tel:${p.replace(/[^+\d]/g, "")}">${esc(p.trim())}</a>`).join(" / ");
  return `<div class="co">
    <h2>${esc(c.name)} <span class="type">${esc(c.type)}</span>${badge}</h2>
    <div class="contact">
      <span><span class="lbl">Tel</span>${phones}</span>
      ${c.website ? `<span><span class="lbl">Web</span><a href="${c.website}" target="_blank" rel="noopener">${esc(host(c.website))}</a></span>` : ""}
      ${c.email ? `<span><span class="lbl">Email</span><a href="mailto:${c.email}">${esc(c.email)}</a></span>` : ""}
    </div>
    <p class="svc">${esc(c.services)}</p>
    <div class="addr">${esc(c.address)}</div>
    <div class="src">Sources: ${c.sources.map(s =>
      `<a href="${s}" target="_blank" rel="noopener">${esc(host(s))}</a>`).join(" &middot; ")}</div>
  </div>`;
}

function render() {
  const terms = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const list = CO.filter(c =>
    (!typeSel.value || c.type === typeSel.value) &&
    terms.every(t => c._hay.includes(t)));
  $("list").innerHTML = list.map(cardHtml).join("");
  $("empty").hidden = list.length > 0;
  $("count").textContent = `${list.length} of ${CO.length} companies`;
}

q.addEventListener("input", render);
typeSel.addEventListener("change", render);

$("sub").innerHTML =
  `Aviation companies and organizations based at or serving ` +
  `<a href="https://en.wikipedia.org/wiki/Burnet_Municipal_Airport">${esc(DATA.airport)}</a> ` +
  `in ${esc(DATA.place)}. Hand-researched from airport directories, FAA repair-station ` +
  `records, and company sites; sources on each card. Researched ${DATA.researched}.`;
$("foot").textContent =
  "Small-town roster - entries marked legacy or unverified reflect stale directory " +
  "listings or unreachable websites at research time. Verify by phone before relying on a listing.";

render();
</script>
