<style>

  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:26px;margin:0 0 4px}

  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  input[type=search],select{background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:10px 12px;font-size:14px;outline:none;width:100%}

  .meta button{background:none;border:none;color:var(--accent2);cursor:pointer;font-size:13px;padding:0}
  .meta button:hover{text-decoration:underline}

  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;
    letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:hover{background:var(--card2)}

  .who{display:flex;gap:10px;align-items:flex-start;min-width:220px}
  .who img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--card2);flex:none}
  .nm{font-weight:600}
  .nm a{color:inherit;text-decoration:none}
  .nm a:hover{color:var(--accent2);text-decoration:underline}
  .hdl{color:var(--muted);font-size:12px}
  .bio{color:var(--muted);font-size:12.5px;margin-top:3px;max-width:52ch;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pubcell{max-width:24ch}
  .pubcell a{color:var(--accent2);text-decoration:none;font-size:13px}
  .pubcell a:hover{text-decoration:underline}
  .tier{display:inline-block;font-size:10px;font-weight:700;color:var(--accent);margin-left:4px}

  .when{white-space:nowrap;font-variant-numeric:tabular-nums}
  .ago{color:var(--muted);font-size:12px;margin-top:2px}
  .kind{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;
    text-transform:uppercase;letter-spacing:.3px;margin-right:6px}
  .kind.like{background:rgba(255,122,69,.15);color:var(--accent);border:1px solid rgba(255,122,69,.35)}
  .kind.reply{background:rgba(79,157,255,.15);color:var(--accent2);border:1px solid rgba(79,157,255,.35)}
  .kind.none{background:rgba(154,163,175,.13);color:var(--muted);border:1px solid var(--line)}

    .kind.like{color:#b4441a}
    .kind.reply{color:#1b5fbe}
  }
  .what{color:var(--muted);font-size:12px;margin-top:3px;max-width:34ch;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .foot{margin-top:24px;color:var(--muted);font-size:12px}
  .foot a{color:var(--accent2);text-decoration:none}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById("followers-data").textContent);
const F = DATA.followers;
const DAY = 86400000;

const $ = (id) => document.getElementById(id);
const q = $("q"), recSel = $("recency"), kindSel = $("kind"), sortSel = $("sort");

for (const f of F) {
  f._hay = [f.name, "@" + f.handle, f.bio, f.pub || ""].join(" ").toLowerCase();
  f._t = f.last ? Date.parse(f.last.date) : null;
}

function avatar(url) {
  if (!url) return "";
  if (url.includes("substackcdn.com/image/fetch/")) return url;
  return "https://substackcdn.com/image/fetch/w_76,h_76,c_fill,f_auto,q_auto:good/" +
         encodeURIComponent(url);
}
function esc(s) {
  return (s || "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}
function agoLabel(t) {
  const d = Math.floor((Date.now() - t) / DAY);
  if (d <= 0) return "today";
  if (d === 1) return "1 day ago";
  if (d < 60) return d + " days ago";
  if (d < 730) return Math.round(d / 30.4) + " months ago";
  return (d / 365).toFixed(1) + " years ago";
}

function matches(f) {
  if (recSel.value === "none") { if (f.last) return false; }
  else if (recSel.value === "old") {
    if (!f._t || Date.now() - f._t <= 365 * DAY) return false;
  } else if (recSel.value) {
    if (!f._t || Date.now() - f._t > Number(recSel.value) * DAY) return false;
  }
  if (kindSel.value && (!f.last || f.last.kind !== kindSel.value)) return false;
  const terms = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return terms.every(t => f._hay.includes(t));
}

const sorters = {
  // "no public activity" always sinks to the bottom
  recent: (a, b) => (b._t || 0) - (a._t || 0),
  oldest: (a, b) => (a._t || Infinity) - (b._t || Infinity),
  name: (a, b) => a.name.localeCompare(b.name),
};

function rowHtml(f) {
  const purl = "https://substack.com/@" + f.handle;
  const last = f.last
    ? `<div class="when"><span class="kind ${f.last.kind}">${f.last.kind}</span>${f.last.date}</div>
       <div class="ago">${agoLabel(f._t)}</div>` +
      (f.last.what ? `<div class="what" title="${esc(f.last.what)}">${esc(f.last.what)}</div>` : "")
    : `<span class="kind none">no public activity</span>`;
  return `<tr>
    <td><div class="who">
      <img loading="lazy" src="${avatar(f.photo)}" alt="" onerror="this.style.visibility='hidden'">
      <div>
        <div class="nm"><a href="${purl}" target="_blank" rel="noopener">${esc(f.name)}</a>
          ${f.tier ? `<span class="tier" title="Substack bestseller tier">&#10022; ${f.tier}</span>` : ""}</div>
        <div class="hdl">@${esc(f.handle)}</div>
        ${f.bio ? `<div class="bio">${esc(f.bio)}</div>` : ""}
      </div>
    </div></td>
    <td class="pubcell">${f.pub ? `<a href="${f.pub_url}" target="_blank" rel="noopener">${esc(f.pub)}</a>` : ""}</td>
    <td>${last}</td>
  </tr>`;
}

function render() {
  const list = F.filter(matches).sort(sorters[sortSel.value]);
  $("rows").innerHTML = list.map(rowHtml).join("");
  $("empty").hidden = list.length > 0;
  $("count").textContent = `${list.length} of ${F.length} followers`;
}

for (const el of [recSel, kindSel, sortSel]) el.addEventListener("change", render);
q.addEventListener("input", render);
$("reset").addEventListener("click", () => {
  q.value = ""; recSel.value = ""; kindSel.value = ""; sortSel.value = "recent"; render();
});

const active = F.filter(f => f.last).length;
$("sub").innerHTML =
  `The publicly listed followers of <a href="https://substack.com/@${DATA.handle}">@${DATA.handle}</a> ` +
  `(${esc(DATA.profile_name)}), with the day each one last liked or replied to anything on Substack. ` +
  `Substack exposes ${DATA.follower_count_public} of the profile's ` +
  `${DATA.follower_count_total.toLocaleString()} followers publicly. Data scraped ${DATA.scraped}.`;
$("foot").innerHTML =
  `"Last like / reply" is the newest item in each follower's public activity feed ` +
  `(likes and replies only, posts excluded); ${F.length - active} followers have no public ` +
  `like/reply activity. Re-run <code>scripts/scrape.js</code> to refresh.`;

render();
</script>
